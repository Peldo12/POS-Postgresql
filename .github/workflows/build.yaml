name: Build Docker Image

on:
  push:
    branches:
      - main
      - test/auto

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository
        run: |
          echo PWD=$(pwd) >> $GITHUB_ENV
          ls -la

      - name: Get Compose File
        run: |
          echo COMPOSE_FILE="$PWD/compose.test.yml" >> $GITHUB_ENV

      - name: Security Audit
        run: |
          npm audit --audit-level=critical

      - name: Get Version
        run: |
          VERSION=$(awk -F'"' '/^[[:space:]]*"version"/ {print $4}' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Export App Version
        run: |
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set Image Repo
        run: |
          echo IMAGE_REPO="kholi12/pos-api" >> $GITHUB_ENV

      - name: Set Image tag
        run: |
          echo IMAGE="$IMAGE_REPO:$VERSION" >> $GITHUB_ENV

      - name: Show Detail
        run: |
          echo $PWD
          echo $VERSION
          echo $COMPOSE_FILE
          echo $IMAGE_REPO
          echo $IMAGE

      - name: Show Docker Version
        run: |
          docker version

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check Existing Image
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image already exists"
            exit 1
          fi

      - name: Build Image
        run: |
          docker build -t "$IMAGE" .

      - name: Show Images
        run: |
          docker images

      - name: Set Service name
        run: |
          echo SERVICE_NAME="backend-test" >> $GITHUB_ENV

      - name: Env Setup
        run: |
          cat > .env.test <<EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          SUPER_NAME=${{ secrets.SUPER_NAME }}
          SUPER_EMAIL=${{ secrets.SUPER_EMAIL }}
          SUPER_PASS=${{ secrets.SUPER_PASS }}
          EOF

      - name: Show Env File
        run: |
          cat .env.test | sed 's/=.*/=***/'

      - name: Config Check
        run: |
          docker compose \
          --env-file .env.test \
          -f compose.test.yml config

      - name: Test Image
        run: |
          docker compose --env-file .env.test \
          -f "$COMPOSE_FILE" \
          up -d --force-recreate "$SERVICE_NAME"

      - name: All Service
        run: |
          docker compose --env-file .env.test -f "$COMPOSE_FILE" ps -a

      - name: Get Container ID
        run: |
          echo CONTAINER_ID=$(docker compose --env-file .env.test -f "$COMPOSE_FILE" ps -q "$SERVICE_NAME") >> $GITHUB_ENV

      - name: Wait Backend Health
        run: ./scripts/wait_health.sh

      - name: Health Check
        run: |
          curl -f http://localhost:3000/api/health || exit 1

      - name: Push Image
        run: |
          docker push "$IMAGE"

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file .env.test -f "$COMPOSE_FILE" logs --tail 50 "$SERVICE_NAME" || true

          docker compose --env-file .env.test -f "$COMPOSE_FILE" logs --tail 50 database || true

          docker compose --env-file .env.test -f "$COMPOSE_FILE" down -v --remove-orphans

          docker compose --env-file .env.test -f "$COMPOSE_FILE" logs --tail 50 redis || true

          docker image prune -f
