name: Build Docker Image

on:
  push:
    branches:
      - main
      - test/auto

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository
        run: |
          echo PWD=$(pwd) >> $GITHUB_ENV
          ls -la

      - name: Get Compose File
        run: echo COMPOSE_FILE="$PWD/compose.test.yml" >> $GITHUB_ENV

      - name: Security Audit
        run: npm audit --audit-level=critical

      - name: Get Version
        run: |
          VERSION=$(awk -F'"' '/^[[:space:]]*"version"/ {print $4}' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set Image Repo
        run: echo IMAGE_REPO="kholi12/pos-api" >> $GITHUB_ENV

      - name: Set Image tag
        run: echo IMAGE="$IMAGE_REPO:$VERSION" >> $GITHUB_ENV

      - name: Show Detail
        run: |
          echo $PWD
          echo $VERSION
          echo $COMPOSE_FILE
          echo $IMAGE_REPO
          echo $IMAGE
          docker images

      - name: Show Docker Version
        run: docker version

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Check Availablity
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image already exists"
            exit 1
          fi

      - name: Build Image
        run: |
          docker build -t "$IMAGE" .

      - name: Test Image
        run: docker compose -f "$COMPOSE_FILE" up -d --force-recreate

      - name: Wait Backend Health
        run: ./scripts/wait_health.sh

      - name: Push Image
        run: |
          docker push "$IMAGE"

      - name: Cleanup
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v
