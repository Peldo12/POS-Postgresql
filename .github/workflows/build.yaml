name: Build Docker Image

on:
  push:
    branches:
      - main
      - test/auto

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_REPO: kholi12/pos-api
      SERVICE_NAME: backend-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Security Audit
        run: |
          npm audit --audit-level=critical

      - name: Get Version
        run: |
          VERSION=$(awk -F'"' '/^[[:space:]]*"version"/ {print $4}' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo IMAGE="$IMAGE_REPO:$VERSION" >> $GITHUB_ENV

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check Existing Image
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Image already exists"
            exit 1
          fi

      - name: Create Test Ennvironment
        run: |
          echo COMPOSE_FILE="$PWD/compose.test.yml" >> $GITHUB_ENV
          cat > .env.test <<EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          SUPER_NAME=${{ secrets.SUPER_NAME }}
          SUPER_EMAIL=${{ secrets.SUPER_EMAIL }}
          SUPER_PASS=${{ secrets.SUPER_PASS }}
          EOF

      - name: Build Image
        run: |
          docker build -t "$IMAGE" .

      - name: Test Image
        run: |
          docker compose --env-file .env.test \
          -f "$COMPOSE_FILE" \
          up -d --force-recreate "$SERVICE_NAME"

      - name: All Service
        run: |
          docker compose --env-file .env.test -f "$COMPOSE_FILE" ps -a
          echo CONTAINER_ID=$(docker compose --env-file .env.test -f "$COMPOSE_FILE" ps -q "$SERVICE_NAME") >> $GITHUB_ENV

      - name: Wait Backend Health
        run: ./scripts/wait_health.sh

      - name: API Health Check
        run: |
          curl -f http://localhost:3000/api/health || exit 1

      - name: Push Image
        run: |
          docker push "$IMAGE"

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file .env.test -f "$COMPOSE_FILE" logs --tail 50 "$SERVICE_NAME" || true

          docker compose --env-file .env.test -f "$COMPOSE_FILE" logs --tail 50 database || true

          docker compose --env-file .env.test -f "$COMPOSE_FILE" down -v --remove-orphans

          docker compose --env-file .env.test -f "$COMPOSE_FILE" logs --tail 50 redis || true

          docker image prune -f
