name: Build Docker Image

on:
  push:
    branches:
      - main
      - test/auto

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository
        run: |
          pwd
          ls -la

      - name: Get Version
        run: |
          VERSION=$(awk -F'"' '/^[[:space:]]*"version"/ {print $4}' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set Image Repo
        run: echo IMAGE_REPO="kholi12/pos-api" >> $GITHUB_ENV

      - name: Set Image tag
        run: echo IMAGE="$IMAGE_REPO:VERSION" >> $GITHUB_ENV

      - name: Show Detail
        run: |
          echo $VERSION
          echo $IMAGE_REPO
          echo $IMAGE

      - name: Show Docker Version
        run: docker version

      - name: Security Audit
        run: npm audit --audit-level=critical

      - name: Build Image
        run: |
          docker build -t kholi12/pos-api:$VERSION .

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image
        run: |
          docker push kholi12/pos-api:$VERSION
