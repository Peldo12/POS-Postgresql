name: SSH Test

on:
  workflow_dispatch:
  push:
    branches:
      - test/auto

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Test Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_DEPLOY }}
          script: |
            echo "Deploy:..." 
            pos-deploy 0.0.2c
            
