name: SSH Test

on:
  workflow_dispatch:
  push:
    branches:
      - test/auto

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_DEPLOY }}
          script: |
            echo "Connected user:"
            whoami

            echo "User groups:"
            id

            echo "Docker status:"
            docker ps

            echo "Deploy:..." 
            pos-deploy 0.0.2c
            
