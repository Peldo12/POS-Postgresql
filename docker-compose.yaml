name: pos
services:
  # Layanan 1: Nginx
  nginx:
    build: ./nginx
    ports:
      - '80:80'
      - '443:443'
    networks:
      - pos_network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Layanan 2: Database PostgreSQL
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Layanan 3: Aplikasi Backend Node.js
  backend:
    image: pos-api:${APP_VERSION}
    networks:
      - pos_network
    ports:
      - '3000:3000'
    volumes:
      - ./logs:/app/logs
      - ./public/upload:/app/public/upload
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
volumes:
  postgres_data:
networks:
  pos_network:
