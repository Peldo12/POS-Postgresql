name: pos
services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - pos_network
    restart: always

  # Layanan 1: Database PostgreSQL
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Layanan 2: Aplikasi Backend Node.js
  backend:
    build: .
    image: pos-api:latest
    networks:
      - pos_network
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
      - ./public/upload:/app/public/upload
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env.dev
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
volumes:
  postgres_data:
networks:
  pos_network:
