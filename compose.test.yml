name: pos-test
services:
  # Layanan Database PostgreSQL
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_db
    volumes:
      - postgres_test:/var/lib/postgresql/data
    networks:
      - test_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d test_db']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Layanan Backend Node.js
  backend-test:
    image: kholi12/pos-api:${APP_VERSION}
    networks:
      - test_network
    environment:
      DB_USER: test_user
      DB_PASS: test_pass
      DB_HOST: database
      DB_NAME: test_db
      REDIS_URL: ${REDIS_URL}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Layanan Redis cache
  redis:
    image: redis:8-alpine
    networks:
      - test_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_test:
  redis_data:
networks:
  test_network:
