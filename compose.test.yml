name: pos-test
services:
  # Layanan Database PostgreSQL
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_test:/var/lib/postgresql/data
    networks:
      - test_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Layanan Backend Node.js
  backend-test:
    image: kholi12/pos-api:${APP_VERSION}
    networks:
      - test_network
    environment:
      NODE_ENV: production
      PORT: 3000
    env_file:
      - .env.test
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Layanan Redis cache
  redis:
    image: redis:8-alpine
    networks:
      - test_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_test:
  redis_data:
networks:
  test_network:
